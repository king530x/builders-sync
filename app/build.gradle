plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.dadouch.builderssync'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.dadouch.builderssync'
        minSdk 29
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer)
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        fixed {
            storeFile file('../keystore/release.jks')
            storePassword 'buildersync'
            keyAlias 'builders'
            keyPassword 'buildersync'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
